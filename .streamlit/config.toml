[browser]
gatherUsageStats = false

[server]
# Match the app's own 10 MB validation and the upload hint in the UI.
maxUploadSize = 10

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
primaryColor = "#6366f1"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
font = "sans serif"
